server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # SameSite=Lax mitigates CSRF for the cookie-session auth model and still
        # allows the OAuth2 redirect callback. httpOnly is left enabled (default).
        same-site: lax

spring:
  application:
    name: docsense-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/doc_qa}
    username: ${DATABASE_USERNAME:docqa_app}
    password: ${DATABASE_PASSWORD:docqa_app_pw}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholders:
      embedding_dim: ${EMBEDDING_DIMENSION:768}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_FILE_SIZE:20MB}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  ai:
    # Model activation toggles. Defaults keep Gemini enabled; the `test` profile
    # sets these to `none` so unit/integration tests run offline against the
    # deterministic stub services instead of calling Google.
    model:
      chat: ${AI_CHAT_MODEL:google-genai}
      embedding:
        text: ${AI_EMBEDDING_MODEL_ENABLED:google-genai}
    google:
      genai:
        # When an api-key is present the client uses the Gemini Developer API
        # (Google AI Studio). Server-side only — never exposed to the frontend.
        api-key: ${GEMINI_API_KEY:}
        chat:
          # In Spring AI 1.1.x the model lives on the nested options object.
          # gemini-2.0-flash has been retired from the Developer API; gemini-2.5-flash
          # is the current stable flash model.
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
        embedding:
          # The embedding connection binds its own api-key (falls back to Vertex
          # and demands project-id when blank).
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              # gemini-embedding-001 is Google's current text embedding model
              # (text-embedding-004 has been retired from the Developer API). Its
              # native width is 3072; we project to 768 to match the pgvector
              # column, so EMBEDDING_DIMENSION stays authoritative.
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              dimensions: ${EMBEDDING_DIMENSION:768}

# ---------------------------------------------------------------------------
# Application-specific configuration
# ---------------------------------------------------------------------------
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  ai:
    # gemini -> real Spring AI Google Gemini beans; stub -> deterministic local
    # stand-ins. Selection drives which EmbeddingService / ChatCompletionClient
    # bean is active (see EmbeddingConfig / ChatClientConfig and the Gemini beans).
    provider: ${AI_PROVIDER:gemini}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  documents:
    # Chunking parameters (used from Phase 3). Configurable per spec §7.
    chunk-size: ${CHUNK_SIZE:1000}
    chunk-overlap: ${CHUNK_OVERLAP:200}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:20971520}
  embeddings:
    # Must match the pgvector column dimension in V1 (Flyway placeholder) and the
    # Gemini embedding model output width (text-embedding-004 => 768).
    dimension: ${EMBEDDING_DIMENSION:768}
  rag:
    # Number of chunks retrieved for context augmentation.
    top-k: ${RAG_TOP_K:5}
